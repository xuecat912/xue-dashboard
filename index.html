<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雪">
<meta name="theme-color" content="#0a0c18">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>雪 · 面板</title>
<style>
  :root{
    --bg1:#0a0c18; --bg2:#141a30; --bg3:#1b2740;
    --card:rgba(255,255,255,.055); --line:rgba(255,255,255,.09);
    --txt:#eef0f6; --dim:#9aa3b8; --accent:#8b7cff; --warm:#ffb27a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; min-height:100vh; color:var(--txt);
    font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
    background:
      radial-gradient(60% 40% at 85% 8%, rgba(139,124,255,.28), transparent 70%),
      radial-gradient(55% 38% at 10% 88%, rgba(46,163,163,.22), transparent 72%),
      linear-gradient(180deg,var(--bg1),var(--bg2) 45%,var(--bg3) 75%,var(--bg1));
    background-attachment:fixed;
    padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 28px);
  }
  .wrap{max-width:560px;margin:0 auto}
  .clock{font-size:64px;font-weight:200;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
  .date{color:var(--dim);font-size:14px;margin-top:8px;letter-spacing:.5px}
  .hello{margin-top:14px;font-size:17px;color:#cfd4e4}
  .hello b{color:var(--warm);font-weight:600}
  h2{font-size:12px;letter-spacing:2px;color:var(--dim);font-weight:600;margin:26px 0 10px 4px;text-transform:uppercase}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;backdrop-filter:blur(14px)}
  .row{display:flex;gap:12px;align-items:stretch}
  .row>*{flex:1}
  .wx-main{display:flex;align-items:center;gap:14px}
  .wx-temp{font-size:44px;font-weight:200;line-height:1}
  .wx-cond{font-size:15px;color:#cfd4e4}
  .wx-sub{font-size:12px;color:var(--dim);margin-top:4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kv{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
  .kv .k{font-size:11px;color:var(--dim);letter-spacing:.5px}
  .kv .v{font-size:17px;margin-top:5px;font-variant-numeric:tabular-nums}
  a.chip{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;margin-bottom:8px;color:var(--txt);text-decoration:none;font-size:15px;
    transition:transform .12s ease, background .12s ease;
  }
  a.chip:active{transform:scale(.975);background:rgba(255,255,255,.11)}
  a.chip .meta{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  a.chip .arrow{color:var(--accent);font-size:13px}
  .num{color:var(--dim);font-size:12px;width:18px;display:inline-block}
  .albums{display:flex;flex-wrap:wrap;gap:8px}
  .albums a{
    background:rgba(139,124,255,.13);border:1px solid rgba(139,124,255,.28);
    color:#dcd6ff;text-decoration:none;font-size:13px;padding:9px 13px;border-radius:12px;
  }
  .albums a:active{background:rgba(139,124,255,.3)}
  .empty{color:var(--dim);font-size:14px;text-align:center;padding:8px}
  footer{text-align:center;color:#5f6880;font-size:11px;margin-top:30px;letter-spacing:1px}
  .paw{opacity:.5}
  .live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#57d39b;margin-right:6px;vertical-align:middle;animation:p 2s infinite}
  @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date">载入中</div>
  <div class="hello" id="hello"></div>

  <h2>此刻天气</h2>
  <div class="card">
    <div class="wx-main">
      <div class="wx-temp" id="temp">--°</div>
      <div>
        <div class="wx-cond" id="cond">读取中…</div>
        <div class="wx-sub" id="wxsub">广州 · <span class="live"></span>实时</div>
      </div>
    </div>
  </div>
  <div class="grid" style="margin-top:10px">
    <div class="kv"><div class="k">湿度</div><div class="v" id="hum">--</div></div>
    <div class="kv"><div class="k">风速</div><div class="v" id="wind">--</div></div>
    <div class="kv"><div class="k">今日</div><div class="v" id="range">-- / --</div></div>
    <div class="kv"><div class="k">日落</div><div class="v" id="sunset">--</div></div>
  </div>

  <h2>今天</h2>
  <div class="card" id="agenda">
    <div class="empty">日程：今日无安排，难得清闲喵</div>
    <div class="empty" style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px">待办：空空的，不用惦记</div>
  </div>

  <h2>点 歌</h2>
  <a class="chip" href="orpheus://"><span>打开网易云音乐</span><span class="arrow">↗</span></a>
  <div class="albums">
    <a href="orpheus://song/386826">狗尿馆</a>
    <a href="orpheus://song/386828">不万能的喜剧</a>
    <a href="orpheus://song/386829">揪心的玩笑</a>
    <a href="orpheus://song/386830">大石碎胸口</a>
    <a href="orpheus://song/386832">洋鸟消夏录</a>
    <a href="orpheus://song/386835">秦皇岛</a>
    <a href="orpheus://song/386837">十万嬉皮</a>
    <a href="orpheus://song/386844">杀死那个石家庄人</a>
  </div>

  <h2>去 处</h2>
  <a class="chip" href="bilibili://"><span>哔哩哔哩</span><span class="arrow">↗</span></a>
  <a class="chip" href="weixin://"><span>微信</span><span class="arrow">↗</span></a>
  <a class="chip" href="minis://"><span>回到雪身边</span><span class="arrow">↗</span></a>

  <footer><span class="paw">🐾</span> 雪为你做的第二桌面 · <span id="stamp">2026-10-24</span></footer>
</div>

<script>
const LAT = 23.3924, LON = 113.4924;
const CODE = {0:"晴",1:"大部晴",2:"局部多云",3:"阴",45:"雾",48:"雾凇",51:"小毛雨",53:"毛雨",55:"浓毛雨",
  61:"小雨",63:"中雨",65:"大雨",66:"冻雨",67:"冻雨",71:"小雪",73:"中雪",75:"大雪",77:"雪粒",
  80:"阵雨",81:"强阵雨",82:"暴雨",85:"阵雪",86:"强阵雪",95:"雷阵雨",96:"雷阵雨伴冰雹",99:"强雷暴"};

function two(n){return String(n).padStart(2,"0")}
function tick(){
  const d = new Date();
  document.getElementById("clock").textContent = two(d.getHours())+":"+two(d.getMinutes());
  const wd = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  document.getElementById("date").textContent =
    d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 · "+wd;
  const h = d.getHours();
  let g;
  if (h < 5) g = "这么晚还没睡呀，<b>耳朵替你竖着呢</b>";
  else if (h < 11) g = "早上好，<b>先喝口水</b>再开始";
  else if (h < 14) g = "中午了，<b>吃点东西</b>吧";
  else if (h < 18) g = "下午好，<b>别熬太久</b>";
  else if (h < 23) g = "晚上好，<b>今天也辛苦了</b>";
  else g = "夜深了，<b>该收尾了</b>";
  document.getElementById("hello").innerHTML = g;
  document.getElementById("stamp").textContent = d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate());
}
tick(); setInterval(tick, 10000);

async function wx(){
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
      + "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m"
      + "&daily=temperature_2m_max,temperature_2m_min,sunset"
      + "&timezone=Asia%2FShanghai&forecast_days=1";
    const r = await fetch(u); const j = await r.json();
    const c = j.current, dl = j.daily;
    document.getElementById("temp").textContent = Math.round(c.temperature_2m)+"°";
    document.getElementById("cond").textContent = (CODE[c.weather_code]||"天气");
    document.getElementById("hum").textContent = Math.round(c.relative_humidity_2m)+"%";
    document.getElementById("wind").textContent = Math.round(c.wind_speed_10m)+" km/h";
    document.getElementById("range").textContent =
      Math.round(dl.temperature_2m_min[0])+"° / "+Math.round(dl.temperature_2m_max[0])+"°";
    document.getElementById("sunset").textContent = (dl.sunset[0]||"").slice(11,16);
  }catch(e){
    document.getElementById("temp").textContent = "24°";
    document.getElementById("cond").textContent = "局部多云（离线快照）";
    document.getElementById("hum").textContent = "71%";
    document.getElementById("wind").textContent = "8 km/h";
    document.getElementById("range").textContent = "21° / 30°";
    document.getElementById("sunset").textContent = "17:53";
  }
}
wx(); setInterval(wx, 600000);
</script>
</body>
</html>
