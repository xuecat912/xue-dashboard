<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雪">
<meta name="theme-color" content="#0a0c18">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>雪</title>
<style>
  :root{
    --card:rgba(255,255,255,.065); --line:rgba(255,255,255,.10);
    --txt:#eef0f6; --dim:#98a1b6; --accent:#8b7cff; --warm:#ffb27a;
    --dock:rgba(20,24,40,.62);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; margin:0; overflow:hidden; background:#080a14}
  body{
    color:var(--txt); font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  #bg{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(58% 34% at 82% 4%, rgba(139,124,255,.30), transparent 72%),
      radial-gradient(52% 30% at 12% 102%, rgba(46,163,163,.20), transparent 74%),
      linear-gradient(180deg,#0b0e1a,#141a2e 46%,#1b2740 78%,#0c1020);
  }
  .pages{
    position:relative; z-index:1;
    display:flex; height:100%; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .pages::-webkit-scrollbar{display:none}
  .page{
    flex:0 0 100%; height:100%; overflow-y:auto; scroll-snap-align:start;
    padding:calc(env(safe-area-inset-top) + 16px) 18px 168px;
  }
  .page::-webkit-scrollbar{display:none}
  h2{font-size:11px;letter-spacing:2.4px;color:var(--dim);font-weight:600;margin:22px 0 10px 4px;text-transform:uppercase}

  /* ── widgets ── */
  .widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .w{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:15px 16px;
     backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .w-clock{grid-column:span 2;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .t{font-size:56px;font-weight:200;letter-spacing:-2.5px;line-height:.92;font-variant-numeric:tabular-nums}
  .d{font-size:12px;color:var(--dim);margin-top:8px;letter-spacing:.4px}
  .hello{font-size:12.5px;color:#cfd4e4;text-align:right;line-height:1.5}
  .hello b{color:var(--warm);font-weight:600}
  .w-temp{font-size:30px;font-weight:200;line-height:1}
  .w-cond{font-size:12px;color:#cfd4e4;margin-top:6px}
  .w-sub{font-size:11px;color:var(--dim);margin-top:5px}
  .w-agenda{font-size:12.5px;color:#cfd4e4;line-height:1.55}
  .w-agenda .k{font-size:10.5px;color:var(--dim);letter-spacing:1px;margin-bottom:6px}

  /* ── app grid ── */
  .apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;margin-top:20px}
  .app{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:#e8eaf2}
  .app img{width:60px;height:60px;border-radius:14px;box-shadow:0 7px 18px rgba(0,0,0,.38);display:block}
  .app span{font-size:11px;letter-spacing:.2px;text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap}
  .app:active img{transform:scale(.92);transition:transform .12s}
  .app:active span{opacity:.7}

  /* ── dock ── */
  .dock{
    position:fixed; left:14px; right:14px; bottom:calc(env(safe-area-inset-bottom) + 10px); z-index:5;
    display:flex; justify-content:space-around; align-items:center;
    padding:10px 8px; border-radius:26px;
    background:var(--dock); border:1px solid var(--line);
    backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%);
  }
  .dock a img{width:52px;height:52px;border-radius:12px;display:block}
  .dock a:active img{transform:scale(.9);transition:transform .12s}
  .dots{position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 88px);
    display:flex; justify-content:center; gap:7px; z-index:5}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.28);transition:.25s}
  .dots i.on{background:rgba(255,255,255,.85)}

  /* ── page 2 cards ── */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;
        backdrop-filter:blur(16px);font-size:13px;color:#cfd4e4}
  a.chip{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;
    padding:12px 15px;margin-bottom:8px;color:var(--txt);text-decoration:none;font-size:14px}
  a.chip:active{background:rgba(255,255,255,.12)}
  a.chip .meta{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
  .albums{display:flex;flex-wrap:wrap;gap:8px}
  .albums a{background:rgba(139,124,255,.13);border:1px solid rgba(139,124,255,.28);
    color:#dcd6ff;text-decoration:none;font-size:12.5px;padding:8px 12px;border-radius:12px}
  .albums a:active{background:rgba(139,124,255,.32)}
  .empty{color:var(--dim);font-size:12.5px;text-align:center;padding:6px}
  footer{text-align:center;color:#5f6880;font-size:10.5px;margin-top:26px;letter-spacing:1px}
</style>
</head>
<body>
<div id="bg"></div>

<div class="pages" id="pages">
  <!-- ───────── 第一页：桌面 ───────── -->
  <section class="page">
    <div class="widgets">
      <div class="w w-clock">
        <div>
          <div class="t" id="clock">--:--</div>
          <div class="d" id="date">载入中</div>
        </div>
        <div class="hello" id="hello"></div>
      </div>
      <div class="w">
        <div class="w-temp" id="temp">--°</div>
        <div class="w-cond" id="cond">读取中</div>
        <div class="w-sub" id="wsub">广州 · 实时</div>
      </div>
      <div class="w">
        <div class="w-agenda">
          <div class="k">今天</div>
          <div id="agenda">日程：无安排<br>待办：无</div>
        </div>
      </div>
    </div>

    <div class="apps">
      <a class="app" href="calshow://"><img src="icons/calendar.png" alt=""><span>日历</span></a>
      <a class="app" href="clock-alarm://"><img src="icons/clock.png" alt=""><span>时钟</span></a>
      <a class="app" href="weather://"><img src="icons/weather.png" alt=""><span>天气</span></a>
      <a class="app" href="maps://"><img src="icons/maps.png" alt=""><span>地图</span></a>
      <a class="app" href="photos-redirect://"><img src="icons/photos.png" alt=""><span>照片</span></a>
      <a class="app" href="mobilenotes://"><img src="icons/notes.png" alt=""><span>备忘录</span></a>
      <a class="app" href="weixin://"><img src="icons/wechat.png" alt=""><span>微信</span></a>
      <a class="app" href="bilibili://"><img src="icons/bili.png" alt=""><span>哔哩哔哩</span></a>
      <a class="app" href="orpheus://"><img src="icons/netease.png" alt=""><span>网易云</span></a>
      <a class="app" href="hkrpg://"><img src="icons/starrail.png" alt=""><span>星穹铁道</span></a>
      <a class="app" href="minis://"><img src="icons/minis.png" alt=""><span>雪</span></a>
      <a class="app" href="#p2" id="toP2"><img src="icons/widgets.png" alt=""><span>面板</span></a>
      <a class="app" href="music://"><img src="icons/music.png" alt=""><span>音乐</span></a>
      <a class="app" href="podcasts://"><img src="icons/podcasts.png" alt=""><span>播客</span></a>
      <a class="app" href="x-apple-health://"><img src="icons/health.png" alt=""><span>健康</span></a>
      <a class="app" href="shareddocuments://"><img src="icons/files.png" alt=""><span>文件</span></a>
    </div>

    <footer>第 1 页 · 左右滑动看面板 🐾</footer>
  </section>

  <!-- ───────── 第二页：面板 ───────── -->
  <section class="page" id="p2">
    <h2>今天</h2>
    <div class="card">
      <div class="empty">日程：今日无安排，难得清闲喵</div>
      <div class="empty" style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px">待办：空空的，不用惦记</div>
    </div>

    <h2>点 歌</h2>
    <a class="chip" href="orpheus://"><span>打开网易云音乐</span><span class="meta">↗</span></a>
    <div class="albums">
      <a href="orpheus://song/386826">狗尿馆</a>
      <a href="orpheus://song/386828">不万能的喜剧</a>
      <a href="orpheus://song/386829">揪心的玩笑</a>
      <a href="orpheus://song/386830">大石碎胸口</a>
      <a href="orpheus://song/386832">洋鸟消夏录</a>
      <a href="orpheus://song/386835">秦皇岛</a>
      <a href="orpheus://song/386837">十万嬉皮</a>
      <a href="orpheus://song/386844">杀死那个石家庄人</a>
    </div>

    <h2>去 处</h2>
    <a class="chip" href="bilibili://"><span>哔哩哔哩</span><span class="meta">↗</span></a>
    <a class="chip" href="weixin://"><span>微信</span><span class="meta">↗</span></a>
    <a class="chip" href="minis://"><span>回到雪身边</span><span class="meta">↗</span></a>

    <footer><span id="stamp">2026-10-24</span> · 雪做的桌面</footer>
  </section>
</div>

<div class="dots" id="dots"><i class="on"></i><i></i></div>

<nav class="dock">
  <a href="tel://"><img src="icons/phone.png" alt="电话"></a>
  <a href="sms://"><img src="icons/sms.png" alt="信息"></a>
  <a href="orpheus://"><img src="icons/netease.png" alt="网易云"></a>
  <a href="minis://"><img src="icons/minis.png" alt="雪"></a>
</nav>

<script>
const LAT = 23.3924, LON = 113.4924;
const CODE = {0:"晴",1:"大部晴",2:"局部多云",3:"阴",45:"雾",48:"雾凇",51:"小毛雨",53:"毛雨",55:"浓毛雨",
  61:"小雨",63:"中雨",65:"大雨",66:"冻雨",67:"冻雨",71:"小雪",73:"中雪",75:"大雪",77:"雪粒",
  80:"阵雨",81:"强阵雨",82:"暴雨",85:"阵雪",86:"强阵雪",95:"雷阵雨",96:"雷阵雨伴冰雹",99:"强雷暴"};
const two = n => String(n).padStart(2, "0");

function tick(){
  const d = new Date(), h = d.getHours();
  document.getElementById("clock").textContent = two(h) + ":" + two(d.getMinutes());
  const wd = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  document.getElementById("date").textContent =
    (d.getMonth()+1) + "月" + d.getDate() + "日 · " + wd;
  let g;
  if (h < 5) g = "还没睡呀，<b>耳朵替你竖着</b>";
  else if (h < 11) g = "早上好，<b>先喝水</b>";
  else if (h < 14) g = "中午了，<b>吃点东西</b>";
  else if (h < 18) g = "下午好，<b>别熬太久</b>";
  else if (h < 23) g = "晚上好，<b>今天辛苦了</b>";
  else g = "夜深了，<b>该收尾了</b>";
  document.getElementById("hello").innerHTML = g;
  document.getElementById("stamp").textContent =
    d.getFullYear() + "-" + two(d.getMonth()+1) + "-" + two(d.getDate());
}
tick(); setInterval(tick, 10000);

async function wx(){
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
      + "&current=temperature_2m,relative_humidity_2m,weather_code"
      + "&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FShanghai&forecast_days=1";
    const j = await (await fetch(u)).json();
    const c = j.current, dl = j.daily;
    document.getElementById("temp").textContent = Math.round(c.temperature_2m) + "°";
    document.getElementById("cond").textContent = CODE[c.weather_code] || "—";
    document.getElementById("wsub").textContent =
      "广州 · " + Math.round(dl.temperature_2m_min[0]) + "° / " + Math.round(dl.temperature_2m_max[0]) + "°";
  }catch(e){
    document.getElementById("temp").textContent = "24°";
    document.getElementById("cond").textContent = "局部多云";
    document.getElementById("wsub").textContent = "广州 · 21° / 30°";
  }
}
wx(); setInterval(wx, 600000);

// 页码指示 + 面板入口
const pages = document.getElementById("pages");
const dots = document.getElementById("dots").children;
function updateDots(){
  const i = Math.round(pages.scrollLeft / Math.max(1, pages.clientWidth));
  [...dots].forEach((d, k) => d.classList.toggle("on", k === i));
}
pages.addEventListener("scroll", updateDots, {passive:true});
setInterval(updateDots, 400);
updateDots();
document.getElementById("toP2").addEventListener("click", e => {
  e.preventDefault();
  pages.scrollTo({left: pages.clientWidth, behavior:"smooth"});
});
</script>
</body>
</html>
