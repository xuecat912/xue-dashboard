<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雪">
<meta name="theme-color" content="#0a0c18">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>雪</title>
<style>
  :root{
    --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.10);
    --txt:#eef0f6; --dim:#98a1b6; --accent:#8b7cff; --warm:#ffb27a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; min-height:100%; background:#080a14}
  body{
    color:var(--txt); font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    background:
      radial-gradient(60% 36% at 85% 3%, rgba(139,124,255,.28), transparent 72%),
      radial-gradient(55% 34% at 8% 100%, rgba(46,163,163,.20), transparent 74%),
      linear-gradient(180deg,#0b0e1a,#141a2e 46%,#1b2740 78%,#0c1020);
    background-attachment:fixed;
    padding:calc(env(safe-area-inset-top) + 26px) 18px calc(env(safe-area-inset-bottom) + 34px);
  }
  .wrap{max-width:560px; margin:0 auto}

  /* 顶部时钟 */
  .clock{font-size:68px; font-weight:200; letter-spacing:-3px; line-height:.9; font-variant-numeric:tabular-nums}
  .date{color:var(--dim); font-size:13.5px; margin-top:10px; letter-spacing:.4px}
  .hello{margin-top:16px; font-size:16px; color:#cfd4e4; line-height:1.5}
  .hello b{color:var(--warm); font-weight:600}

  h2{font-size:11px; letter-spacing:2.6px; color:var(--dim); font-weight:600;
     margin:26px 0 10px 4px; text-transform:uppercase}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:18px 18px 16px; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  }

  /* 天气 */
  .wx-top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
  .wx-temp{font-size:52px; font-weight:200; line-height:.95; letter-spacing:-2px}
  .wx-temp span{font-size:22px; font-weight:300; letter-spacing:0; margin-left:2px}
  .wx-right{text-align:right}
  .wx-cond{font-size:15px; color:#dfe3ee}
  .wx-city{font-size:11.5px; color:var(--dim); margin-top:6px}
  .wx-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px}
  .kv{background:rgba(255,255,255,.045); border-radius:14px; padding:9px 8px; text-align:center}
  .kv .k{font-size:10px; color:var(--dim); letter-spacing:.6px}
  .kv .v{font-size:13.5px; margin-top:4px; font-variant-numeric:tabular-nums; white-space:nowrap; letter-spacing:-.2px}

  /* 今天 */
  .rowline{display:flex; gap:10px; align-items:baseline; padding:7px 0}
  .rowline .lab{font-size:11px; color:var(--dim); letter-spacing:1px; width:38px; flex:none}
  .rowline .val{font-size:13.5px; color:#dfe3ee; line-height:1.6}

  /* 链接行 */
  a.chip{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-top:8px; color:var(--txt); text-decoration:none; font-size:14.5px;
  }
  a.chip:active{background:rgba(255,255,255,.12); transform:scale(.99)}
  a.chip .meta{color:var(--dim); font-size:11.5px}
  a.chip .arrow{color:var(--accent); font-size:13px}
  a.chip:first-of-type{margin-top:0}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
  .chips a{
    background:rgba(139,124,255,.13); border:1px solid rgba(139,124,255,.28);
    color:#dcd6ff; text-decoration:none; font-size:12.5px; padding:8px 12px; border-radius:12px;
  }
  .chips a:active{background:rgba(139,124,255,.32)}
  .sub{font-size:11px; color:#6f7890; margin-top:12px; letter-spacing:.5px}
  footer{text-align:center; color:#5f6880; font-size:10.5px; margin-top:28px; letter-spacing:1px; line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date">载入中</div>
  <div class="hello" id="hello"></div>

  <h2>此刻</h2>
  <div class="card">
    <div class="wx-top">
      <div class="wx-temp"><span id="temp">--</span><span id="unit">°</span></div>
      <div class="wx-right">
        <div class="wx-cond" id="cond">读取中…</div>
        <div class="wx-city" id="city">广州</div>
      </div>
    </div>
    <div class="wx-grid">
      <div class="kv"><div class="k">湿度</div><div class="v" id="hum">--</div></div>
      <div class="kv"><div class="k">风速</div><div class="v" id="wind">--</div></div>
      <div class="kv"><div class="k">日落</div><div class="v" id="sunset">--</div></div>
      <div class="kv"><div class="k">温区</div><div class="v" id="range">--</div></div>
    </div>
    <div class="sub" id="wxsub">实时更新中</div>
  </div>

  <h2>今天</h2>
  <div class="card">
    <div class="rowline"><span class="lab">日程</span><span class="val" id="agenda">今日无安排，难得清闲</span></div>
    <div class="rowline"><span class="lab">待办</span><span class="val">空空如也，不用惦记</span></div>
  </div>

  <h2>点歌</h2>
  <div class="card">
    <a class="chip" href="orpheus://"><span>打开网易云音乐</span><span class="arrow">↗</span></a>
    <div class="chips">
      <a href="orpheus://song/386826">狗尿馆</a>
      <a href="orpheus://song/386828">不万能的喜剧</a>
      <a href="orpheus://song/386829">揪心的玩笑</a>
      <a href="orpheus://song/386830">大石碎胸口</a>
      <a href="orpheus://song/386832">洋鸟消夏录</a>
      <a href="orpheus://song/386835">秦皇岛</a>
      <a href="orpheus://song/386837">十万嬉皮</a>
      <a href="orpheus://song/386844">杀死那个石家庄人</a>
    </div>
    <div class="sub">万青《万能青年旅店》· 2010 · 8 首</div>
  </div>

  <h2>去处</h2>
  <div class="card">
    <a class="chip" href="bilibili://"><span>哔哩哔哩</span><span class="arrow">↗</span></a>
    <a class="chip" href="weixin://"><span>微信</span><span class="arrow">↗</span></a>
    <a class="chip" href="x-apple-health://"><span>健康</span><span class="arrow">↗</span></a>
    <a class="chip" href="minis://"><span>回到雪身边</span><span class="meta">聊天</span><span class="arrow">↗</span></a>
  </div>

  <footer>
    <span id="stamp">2026-10-24</span> · 雪做的第二桌面<br>
    点「回到雪身边」随时找我 🐾
  </footer>
</div>

<script>
const LAT = 23.3924, LON = 113.4924;
const CODE = {0:"晴",1:"大部晴",2:"局部多云",3:"阴",45:"雾",48:"雾凇",51:"小毛雨",53:"毛雨",55:"浓毛雨",
  61:"小雨",63:"中雨",65:"大雨",66:"冻雨",67:"冻雨",71:"小雪",73:"中雪",75:"大雪",77:"雪粒",
  80:"阵雨",81:"强阵雨",82:"暴雨",85:"阵雪",86:"强阵雪",95:"雷阵雨",96:"雷阵雨伴冰雹",99:"强雷暴"};
const two = n => String(n).padStart(2, "0");

function tick(){
  const d = new Date(), h = d.getHours();
  document.getElementById("clock").textContent = two(h) + ":" + two(d.getMinutes());
  const wd = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  document.getElementById("date").textContent =
    d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日 · " + wd;
  let g;
  if (h < 5) g = "这么晚还没睡呀，<b>耳朵替你竖着呢</b>";
  else if (h < 11) g = "早上好，<b>先喝口水</b>再开始";
  else if (h < 14) g = "中午了，<b>吃点东西</b>吧";
  else if (h < 18) g = "下午好，<b>别熬太久</b>了";
  else if (h < 23) g = "晚上好，<b>今天也辛苦了</b>";
  else g = "夜深了，<b>该收尾了</b>";
  document.getElementById("hello").innerHTML = g;
  document.getElementById("stamp").textContent =
    d.getFullYear() + "-" + two(d.getMonth()+1) + "-" + two(d.getDate());
}
tick(); setInterval(tick, 10000);

async function wx(){
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
      + "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m"
      + "&daily=temperature_2m_max,temperature_2m_min,sunset"
      + "&timezone=Asia%2FShanghai&forecast_days=1";
    const j = await (await fetch(u)).json();
    const c = j.current, dl = j.daily;
    const data = {
      t: Math.round(c.temperature_2m),
      cond: CODE[c.weather_code] || "—",
      hum: Math.round(c.relative_humidity_2m) + "%",
      wind: Math.round(c.wind_speed_10m) + " km/h",
      sunset: (dl.sunset[0] || "").slice(11, 16),
      range: Math.round(dl.temperature_2m_min[0]) + "° / " + Math.round(dl.temperature_2m_max[0]) + "°",
      at: Date.now()
    };
    localStorage.setItem("xue_wx", JSON.stringify(data));
    paintWx(data, false);
  }catch(e){
    let d = null;
    try{ d = JSON.parse(localStorage.getItem("xue_wx") || "null"); }catch(_){}
    if (d) paintWx(d, true);
    else document.getElementById("wxsub").textContent = "离线 · 连上网络后自会更新";
  }
}
function paintWx(d, offline){
  document.getElementById("temp").textContent = d.t;
  document.getElementById("cond").textContent = d.cond;
  document.getElementById("hum").textContent = d.hum;
  document.getElementById("wind").textContent = d.wind;
  document.getElementById("sunset").textContent = d.sunset || "--";
  document.getElementById("range").textContent = d.range;
  const t = new Date(d.at);
  document.getElementById("wxsub").textContent = offline
    ? "离线 · 上次 " + two(t.getHours()) + ":" + two(t.getMinutes())
    : "刚刚更新 · " + two(t.getHours()) + ":" + two(t.getMinutes());
}
wx(); setInterval(wx, 600000);

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
