<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雪">
<meta name="theme-color" content="#0a0c18">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>雪</title>
<style>
  :root{
    --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.10);
    --txt:#eef0f6; --dim:#98a1b6; --accent:#8b7cff; --warm:#ffb27a;
    --bg:#080a14;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    margin:0; color:var(--txt); min-height:100vh;
    font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    background:
      radial-gradient(60% 30% at 88% 0%, rgba(139,124,255,.26), transparent 72%),
      radial-gradient(55% 28% at 6% 100%, rgba(46,163,163,.18), transparent 74%),
      linear-gradient(180deg,#0b0e1a,#141a2e 48%,#1b2740 80%,#0c1020);
    background-attachment:fixed;
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 30px);
  }
  .wrap{max-width:600px; margin:0 auto}

  /* 顶部 */
  .top{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding:4px 4px 0}
  .clock{font-size:40px; font-weight:200; letter-spacing:-1.6px; line-height:1; font-variant-numeric:tabular-nums}
  .dt{font-size:11.5px; color:var(--dim); margin-top:6px; letter-spacing:.4px}
  .hello{font-size:12px; color:#cfd4e4; text-align:right; line-height:1.5}
  .hello b{color:var(--warm); font-weight:600}

  /* 搜索 */
  .searchbox{margin:16px 0 0; position:relative}
  #q{
    width:100%; padding:14px 16px 14px 42px; border-radius:16px; font-size:16px;
    background:rgba(255,255,255,.09); border:1px solid var(--line); color:var(--txt);
    outline:none; font-family:inherit;
  }
  #q::placeholder{color:#8b95aa}
  .searchbox svg{position:absolute; left:15px; top:15px; width:16px; height:16px; opacity:.55}

  h2{font-size:10.5px; letter-spacing:2.4px; color:var(--dim); font-weight:600;
     margin:24px 0 8px 4px; text-transform:uppercase}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px;
        padding:13px 15px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px)}

  /* 天气+日程 */
  .stat{display:flex; align-items:center; gap:14px}
  .stat .t{font-size:30px; font-weight:200; letter-spacing:-1px}
  .stat .c{font-size:12px; color:#dfe3ee}
  .stat .m{font-size:10.5px; color:var(--dim); margin-top:3px}
  .sep{width:1px; align-self:stretch; background:var(--line)}
  .stat .a{font-size:12px; color:#cfd4e4; line-height:1.5; flex:1}

  /* 行 */
  .list{background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden}
  .row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 16px; color:var(--txt); text-decoration:none; font-size:14.5px;
    border-top:1px solid rgba(255,255,255,.055);
  }
  .row:first-child{border-top:none}
  .row:active{background:rgba(255,255,255,.10)}
  .row .n{display:flex; align-items:center; gap:9px; min-width:0}
  .row .n span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .n i{width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.22); flex:none}
  .row .arrow{color:var(--accent); font-size:12px; opacity:.85}
  .row.pri .n i{background:var(--accent)}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:9px}
  .chips a{background:rgba(139,124,255,.13); border:1px solid rgba(139,124,255,.28);
    color:#dcd6ff; text-decoration:none; font-size:12.5px; padding:8px 12px; border-radius:12px}
  .chips a:active{background:rgba(139,124,255,.32)}
  .sub{font-size:10.5px; color:#6f7890; margin-top:10px; letter-spacing:.4px}
  .empty{color:var(--dim); font-size:13px; text-align:center; padding:26px 0}
  footer{text-align:center; color:#5f6880; font-size:10.5px; margin-top:26px; letter-spacing:1px; line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="dt" id="dt">载入中</div>
    </div>
    <div class="hello" id="hello"></div>
  </div>

  <div class="searchbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    <input id="q" type="search" placeholder="找 App、动作…" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>

  <div id="main">
    <h2>此刻</h2>
    <div class="card">
      <div class="stat">
        <div>
          <div class="t" id="temp">--°</div>
          <div class="c" id="cond">—</div>
          <div class="m" id="wxsub">读取中</div>
        </div>
        <div class="sep"></div>
        <div class="a" id="agenda">日程：今日无安排<br>待办：无</div>
      </div>
    </div>

    <div id="sections"></div>

    <footer>
      <span id="stamp"></span> · 雪做的 OS<br>
      长按任意行可复制链接 · 找不到的 App 告诉我，我加进去 🐾
    </footer>
  </div>

  <div id="results" style="display:none"></div>
</div>

<script>
const LAT = 23.3924, LON = 113.4924;
const CODE = {0:"晴",1:"大部晴",2:"局部多云",3:"阴",45:"雾",48:"雾凇",51:"小毛雨",53:"毛雨",55:"浓毛雨",
  61:"小雨",63:"中雨",65:"大雨",66:"冻雨",67:"冻雨",71:"小雪",73:"中雪",75:"大雪",77:"雪粒",
  80:"阵雨",81:"强阵雨",82:"暴雨",85:"阵雪",86:"强阵雪",95:"雷阵雨",96:"雷阵雨伴冰雹",99:"强雷暴"};
const two = n => String(n).padStart(2, "0");

/* ───────── App 目录：名字 / scheme / 拼音首字母（用于搜索） ───────── */
const APPS = [
  // 常用
  { n:"微信", s:"weixin://", c:"常用", k:"wx" },
  { n:"网易云音乐", s:"orpheus://", c:"常用", k:"wyy" },
  { n:"哔哩哔哩", s:"bilibili://", c:"常用", k:"bili" },
  { n:"支付宝", s:"alipay://", c:"常用", k:"zfb" },
  { n:"星穹铁道", s:"hkrpg://", c:"常用", k:"xqtd" },
  { n:"回到雪", s:"minis://", c:"常用", k:"hdx" },

  // 系统
  { n:"电话", s:"tel://", c:"系统", k:"dh" },
  { n:"信息", s:"sms://", c:"系统", k:"xx" },
  { n:"FaceTime", s:"facetime://", c:"系统", k:"ft" },
  { n:"邮件", s:"mailto://", c:"系统", k:"yj" },
  { n:"日历", s:"calshow://", c:"系统", k:"rl" },
  { n:"时钟 / 闹钟", s:"clock-alarm://", c:"系统", k:"sz" },
  { n:"提醒事项", s:"x-apple-reminder://", c:"系统", k:"txsx" },
  { n:"备忘录", s:"mobilenotes://", c:"系统", k:"bwl" },
  { n:"天气", s:"weather://", c:"系统", k:"tq" },
  { n:"地图", s:"maps://", c:"系统", k:"dt" },
  { n:"照片", s:"photos-redirect://", c:"系统", k:"zp" },
  { n:"文件", s:"shareddocuments://", c:"系统", k:"wj" },
  { n:"健康", s:"x-apple-health://", c:"系统", k:"jk" },
  { n:"音乐", s:"music://", c:"系统", k:"yy" },
  { n:"播客", s:"podcasts://", c:"系统", k:"bk" },
  { n:"App Store", s:"itms-apps://", c:"系统", k:"as" },
  { n:"快捷指令", s:"shortcuts://", c:"系统", k:"kqzl" },

  // 社交
  { n:"QQ", s:"mqq://", c:"社交", k:"qq" },
  { n:"微博", s:"sinaweibo://", c:"社交", k:"wb" },
  { n:"小红书", s:"xhsdiscover://", c:"社交", k:"xhs" },
  { n:"抖音", s:"snssdk1128://", c:"社交", k:"dy" },
  { n:"快手", s:"kwai://", c:"社交", k:"ks" },
  { n:"Telegram", s:"tg://", c:"社交", k:"tg" },
  { n:"WhatsApp", s:"whatsapp://", c:"社交", k:"wa" },
  { n:"Discord", s:"discord://", c:"社交", k:"dc" },
  { n:"知乎", s:"zhihu://", c:"社交", k:"zh" },
  { n:"豆瓣", s:"douban://", c:"社交", k:"db" },

  // 影音
  { n:"QQ音乐", s:"qqmusic://", c:"影音", k:"qqyy" },
  { n:"酷狗音乐", s:"kugou://", c:"影音", k:"kg" },
  { n:"喜马拉雅", s:"ximalaya://", c:"影音", k:"xmay" },
  { n:"腾讯视频", s:"tenvideo://", c:"影音", k:"txsp" },
  { n:"爱奇艺", s:"iqiyi://", c:"影音", k:"aqy" },
  { n:"优酷", s:"youku://", c:"影音", k:"yk" },
  { n:"芒果TV", s:"mgtv://", c:"影音", k:"mgtv" },
  { n:"YouTube", s:"youtube://", c:"影音", k:"yt" },
  { n:"Spotify", s:"spotify://", c:"影音", k:"sp" },
  { n:"Netflix", s:"nflx://", c:"影音", k:"nf" },

  // 生活 / 出行 / 购物
  { n:"淘宝", s:"taobao://", c:"生活", k:"tb" },
  { n:"京东", s:"openapp.jdmobile://", c:"生活", k:"jd" },
  { n:"拼多多", s:"pinduoduo://", c:"生活", k:"pdd" },
  { n:"美团", s:"imeituan://", c:"生活", k:"mt" },
  { n:"饿了么", s:"ele.me://", c:"生活", k:"elm" },
  { n:"滴滴出行", s:"diditaxi://", c:"生活", k:"dd" },
  { n:"高德地图", s:"iosamap://", c:"生活", k:"gd" },
  { n:"百度地图", s:"baidumap://", c:"生活", k:"bd" },
  { n:"12306", s:"cn.12306://", c:"生活", k:"12306" },

  // 工作 / 效率
  { n:"飞书", s:"lark://", c:"效率", k:"fs" },
  { n:"钉钉", s:"dingtalk://", c:"效率", k:"dd2" },
  { n:"企业微信", s:"wxwork://", c:"效率", k:"qywx" },
  { n:"Notion", s:"notion://", c:"效率", k:"nt" },
  { n:"百度网盘", s:"baiduyun://", c:"效率", k:"bdwp" },

  // 游戏
  { n:"Steam", s:"steam://", c:"游戏", k:"steam" }
];

const CATS = ["常用", "系统", "社交", "影音", "生活", "效率", "游戏"];

/* ───────── 渲染 ───────── */
const sectionsEl = document.getElementById("sections");
const resultsEl = document.getElementById("results");
const mainEl = document.getElementById("main");

function rowHTML(a){
  return `<a class="row${a.c === "常用" ? " pri" : ""}" href="${a.s}"><span class="n"><i></i><span>${a.n}</span></span><span class="arrow">↗</span></a>`;
}

function buildSections(){
  sectionsEl.innerHTML = CATS.map(cat => {
    const list = APPS.filter(a => a.c === cat);
    if (!list.length) return "";
    const rows = list.map(rowHTML).join("");
    return `<h2>${cat}</h2><div class="list">${rows}</div>`;
  }).join("") + `
    <h2>点歌</h2>
    <div class="card">
      <div class="chips">
        <a href="orpheus://song/386826">狗尿馆</a>
        <a href="orpheus://song/386828">不万能的喜剧</a>
        <a href="orpheus://song/386829">揪心的玩笑</a>
        <a href="orpheus://song/386830">大石碎胸口</a>
        <a href="orpheus://song/386832">洋鸟消夏录</a>
        <a href="orpheus://song/386835">秦皇岛</a>
        <a href="orpheus://song/386837">十万嬉皮</a>
        <a href="orpheus://song/386844">杀死那个石家庄人</a>
      </div>
      <div class="sub">万青《万能青年旅店》· 2010</div>
    </div>`;
}
buildSections();

/* ───────── 搜索 ───────── */
const qEl = document.getElementById("q");
function doSearch(){
  const q = qEl.value.trim().toLowerCase();
  if (!q){
    mainEl.style.display = "";
    resultsEl.style.display = "none";
    resultsEl.innerHTML = "";
    return;
  }
  const hits = APPS.filter(a =>
    a.n.toLowerCase().includes(q) || a.k.includes(q) || a.s.toLowerCase().includes(q)
  );
  mainEl.style.display = "none";
  resultsEl.style.display = "";
  resultsEl.innerHTML = hits.length
    ? `<h2>结果 ${hits.length}</h2><div class="list">${hits.map(rowHTML).join("")}</div>`
    : `<div class="empty">没找到「${q}」<br><span style="font-size:11.5px">告诉我名字，我加进去</span></div>`;
}
qEl.addEventListener("input", doSearch);

/* ───────── 长按复制链接 ───────── */
let lpTimer = null;
document.addEventListener("touchstart", e => {
  const row = e.target.closest(".row");
  if (!row) return;
  lpTimer = setTimeout(async () => {
    try{
      await navigator.clipboard.writeText(row.href);
      row.querySelector(".arrow").textContent = "已复制";
      setTimeout(() => { row.querySelector(".arrow").textContent = "↗"; }, 900);
    }catch(_){}
  }, 550);
}, {passive:true});
["touchend","touchmove","touchcancel"].forEach(t =>
  document.addEventListener(t, () => clearTimeout(lpTimer), {passive:true}));

/* ───────── 时钟 ───────── */
function tick(){
  const d = new Date(), h = d.getHours();
  document.getElementById("clock").textContent = two(h) + ":" + two(d.getMinutes());
  const wd = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  document.getElementById("dt").textContent =
    (d.getMonth()+1) + "月" + d.getDate() + "日 · " + wd;
  let g;
  if (h < 5) g = "还没睡呀，<b>耳朵竖着呢</b>";
  else if (h < 11) g = "早上好，<b>先喝水</b>";
  else if (h < 14) g = "中午了，<b>吃点东西</b>";
  else if (h < 18) g = "下午好，<b>别熬太久</b>";
  else if (h < 23) g = "晚上好，<b>今天辛苦了</b>";
  else g = "夜深了，<b>该收尾了</b>";
  document.getElementById("hello").innerHTML = g;
  document.getElementById("stamp").textContent =
    d.getFullYear() + "-" + two(d.getMonth()+1) + "-" + two(d.getDate());
}
tick(); setInterval(tick, 10000);

/* ───────── 天气 ───────── */
async function wx(){
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
      + "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min"
      + "&timezone=Asia%2FShanghai&forecast_days=1";
    const j = await (await fetch(u)).json();
    const c = j.current, dl = j.daily;
    const d = {
      t: Math.round(c.temperature_2m), cond: CODE[c.weather_code] || "—",
      range: Math.round(dl.temperature_2m_min[0]) + "° / " + Math.round(dl.temperature_2m_max[0]) + "°",
      at: Date.now()
    };
    localStorage.setItem("xue_wx2", JSON.stringify(d));
    paint(d, false);
  }catch(e){
    let d = null;
    try{ d = JSON.parse(localStorage.getItem("xue_wx2") || "null"); }catch(_){}
    if (d) paint(d, true);
    else document.getElementById("wxsub").textContent = "离线";
  }
}
function paint(d, offline){
  document.getElementById("temp").textContent = d.t + "°";
  document.getElementById("cond").textContent = d.cond;
  const t = new Date(d.at);
  document.getElementById("wxsub").textContent =
    (offline ? "离线 · 上次 " : "更新 ") + two(t.getHours()) + ":" + two(t.getMinutes()) + " · " + d.range;
}
wx(); setInterval(wx, 600000);

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
